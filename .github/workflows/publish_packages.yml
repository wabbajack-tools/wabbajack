name: Publish Packages to NuGet

on:
  workflow_dispatch: 
  push:
    branches: [ main ]

jobs:
  
  build:
    
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    env:
      NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
      NEXUS_LOGIN: ${{ secrets.NEXUS_LOGIN }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Get App Version from CHANGELOG.md
        shell: bash
        run: |
          VERSION=$(LC_ALL=en_US.UTF-8 grep -m1 -oP '^#### Version - \K[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Current Version: $VERSION"
      
      - name: Set Permissions
        if: runner.os != 'Windows'
        run: chmod -R +x Wabbajack.FileExtractor/Extractors
        
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        if: ${{ github.ref == 'refs/heads/main' }}
        run: dotnet test /p:EnableWindowsTargeting=true

      - name: Test
        if: ${{ github.ref != 'refs/heads/main' }}
        run: dotnet test /p:EnableWindowsTargeting=true --filter "Category!=RequiresOAuth&Category!=RequiresNetwork"
        
      #- name: Upload Test Folder on Failure
      #  if: ${{ failure() }}
      #  uses: actions/upload-artifact@v2
      #  with:
      #    name: Failed Files
      #    path: ./
  
  publish:
    name: Publish Projects
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}

    # Trusted publishing exchanges a GitHub OIDC token for a short lived nuget.org key. Without this the
    # token request fails quietly and the login step has nothing to hand to the push.
    permissions:
      id-token: write
      contents: read

    strategy:
      # One package failing should not cancel the other thirty.
      fail-fast: false
      matrix:
        project:
          - Wabbajack.Common
          - Wabbajack.Compiler
          - Wabbajack.Compression.BSA
          - Wabbajack.Compression.Zip
          - Wabbajack.Configuration
          - Wabbajack.Downloaders.Dispatcher
          - Wabbajack.Downloaders.GameFile
          - Wabbajack.Downloaders.Http
          - Wabbajack.Downloaders.Interfaces
          - Wabbajack.Downloaders.ManualSources
          - Wabbajack.Downloaders.Nexus
          - Wabbajack.Downloaders.VerificationCache
          - Wabbajack.Downloaders.WabbajackCDN
          - Wabbajack.DTOs
          - Wabbajack.FileExtractor
          - Wabbajack.Hashing.PHash
          - Wabbajack.Hashing.xxHash64
          - Wabbajack.Installer
          - Wabbajack.IO.Async
          - Wabbajack.Networking.Discord
          - Wabbajack.Networking.GitHub
          - Wabbajack.Networking.Http
          - Wabbajack.Networking.Http.Interfaces
          - Wabbajack.Networking.NexusApi
          - Wabbajack.Networking.WabbajackClientApi
          - Wabbajack.Paths
          - Wabbajack.Paths.IO
          - Wabbajack.RateLimiter
          - Wabbajack.Services.OSIntegrated
          - Wabbajack.VFS
          - Wabbajack.VFS.Interfaces
          
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          
      - name: Get App Version from CHANGELOG.md
        shell: bash
        run: |
          VERSION=$(LC_ALL=en_US.UTF-8 grep -m1 -oP '^#### Version - \K[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Current Version: $VERSION"
 
          
      - name: Restore
        run: dotnet restore ${{ matrix.project }}/${{ matrix.project }}.csproj
      - name: Build
        run: dotnet build ${{ matrix.project }}/${{ matrix.project }}.csproj --no-restore --configuration Release
      - name: Pack
        run: dotnet pack ${{ matrix.project }}/${{ matrix.project }}.csproj --no-build --configuration Release --include-symbols -p:SymbolPackageFormat=snupkg -o .

      # Requested here rather than earlier in the job because the key nuget.org hands back is only
      # valid for an hour.
      - name: Get a short lived NuGet API key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: halgari

      - name: Publish
        run: dotnet nuget push *.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate
    

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  
  build:
    
    name: Test ${{ matrix.project }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    env:
      NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
      NEXUS_LOGIN: ${{ secrets.NEXUS_LOGIN }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v2

      - name: Get App Version from CHANGELOG.md
        shell: bash
        run: |
          VERSION=$(LC_ALL=en_US.UTF-8 grep -m1 -oP '^#### Version - \K[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Current Version: $VERSION"
      
      - name: Set Permissions
        if: runner.os != 'Windows'
        run: chmod -R +x Wabbajack.Lib/FileExtractor/Extractors
        
      - name: Setup .NET Core SDK 10.0.x
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      # TUnit runs on Microsoft.Testing.Platform; global.json opts dotnet test into MTP mode.
      - name: Test
        if: ${{ github.ref == 'refs/heads/main' }}
        run: dotnet test --project Wabbajack.Test/Wabbajack.Test.csproj /p:EnableWindowsTargeting=true

      - name: Test
        if: ${{ github.ref != 'refs/heads/main' }}
        run: dotnet test --project Wabbajack.Test/Wabbajack.Test.csproj /p:EnableWindowsTargeting=true -- --treenode-filter "/*/*/*/*[Category!=RequiresOAuth]"
        
      #- name: Upload Test Folder on Failure
      #  if: ${{ failure() }}
      #  uses: actions/upload-artifact@v2
      #  with:
      #    name: Failed Files
      #    path: ./
  
  publish:
    name: Publish Wabbajack.Lib
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    needs: build
    steps:
      - uses: actions/checkout@v2

      - name: Setup .NET Core SDK 10.0.x
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Get App Version from CHANGELOG.md
        shell: bash
        run: |
          VERSION=$(LC_ALL=en_US.UTF-8 grep -m1 -oP '^#### Version - \K[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Current Version: $VERSION"

      - name: Restore
        run: dotnet restore Wabbajack.Lib/Wabbajack.Lib.csproj
      - name: Build
        run: dotnet build Wabbajack.Lib/Wabbajack.Lib.csproj --no-restore --configuration Release
      - name: Pack
        run: dotnet pack Wabbajack.Lib/Wabbajack.Lib.csproj --no-build --configuration Release --include-symbols -p:SymbolPackageFormat=snupkg -o .
      - name: Publish
        run: dotnet nuget push *.nupkg --api-key ${{secrets.NUGET_KEY}} --source "https://api.nuget.org/v3/index.json" --skip-duplicate


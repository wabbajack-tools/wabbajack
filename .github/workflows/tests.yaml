name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  
  build:
    
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    env:
      NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
      NEXUS_LOGIN: ${{ secrets.NEXUS_LOGIN }}
    
    strategy:
      # Without this, one platform failing cancels the other before it finishes, so a run tells you that
      # something broke but not whether it broke everywhere. A Linux-only failure looks the same as a
      # failure on both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Get App Version from CHANGELOG.md
        shell: bash
        run: |
          VERSION=$(LC_ALL=en_US.UTF-8 grep -m1 -oP '^#### Version - \K[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Current Version: $VERSION"
      
      - name: Set Permissions
        if: runner.os != 'Windows'
        run: chmod -R +x Wabbajack.FileExtractor/Extractors
        
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        if: ${{ github.ref == 'refs/heads/main' }}
        run: dotnet test /p:EnableWindowsTargeting=true

      - name: Test
        if: ${{ github.ref != 'refs/heads/main' }}
        run: dotnet test /p:EnableWindowsTargeting=true --filter "Category!=RequiresOAuth&Category!=RequiresNetwork"

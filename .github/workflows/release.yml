name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The Linux builds ride along with the Windows release without being able to hold it up: they are built in
  # a job of their own and attached by another that runs only once the Windows release is published. A Linux
  # failure leaves the Windows release exactly as it would have been.
  linux:
    runs-on: ubuntu-latest

    env:
      PUBLISH_DIR: ${{ github.workspace }}/publish-wj-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and package
        id: build
        run: ./release-linux.sh

      - name: Keep the tarballs for publishing
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            ${{ steps.build.outputs.tarball }}
            ${{ steps.build.outputs.launcher }}
          if-no-files-found: error

  release:
    runs-on: windows-latest

    env:
      CODE_SIGN_USER:          ${{ secrets.CODE_SIGN_USER }}
      CODE_SIGN_PASS:          ${{ secrets.CODE_SIGN_PASS }}
      CODE_SIGN_TOTP_SECRET:   ${{ secrets.CODE_SIGN_TOTP_SECRET }}
      GH_TOKEN:                ${{ secrets.GITHUB_TOKEN }}
      PUBLISH_DIR:             ${{ github.workspace }}\publish-wj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download CodeSignTool
        shell: pwsh
        run: |
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip"
          $zip = "$env:RUNNER_TEMP\CodeSignTool.zip"
          $extractRoot = "${{ github.workspace }}\CodeSignTool"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extractRoot -Force
          # Locate the directory containing CodeSignTool.bat (zip may extract with or without nested folder)
          $batFile = Get-ChildItem $extractRoot -Recurse -Filter "CodeSignTool.bat" | Select-Object -First 1
          if (-not $batFile) { throw "CodeSignTool.bat not found after extraction" }
          $codeSignDir = $batFile.Directory.FullName
          Write-Host "CodeSignTool installed at: $codeSignDir"
          "CODE_SIGN_DIR=$codeSignDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build, sign, package, and create GitHub draft release
        id: build
        shell: pwsh
        run: ./release.ps1

      # --- Nexus Mods uploads (official action) ---

      - name: Upload launcher to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.8
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: "1328371"
          filename: ${{ github.workspace }}\publish-wj\Wabbajack.zip
          version: ${{ steps.build.outputs.version }}
          display_name: Wabbajack.zip
          description: |
            Version - ${{ steps.build.outputs.version }} - download this file

            Changelog: https://github.com/wabbajack-tools/wabbajack/releases/tag/${{ steps.build.outputs.version }}
          category: main

      - name: Upload full release to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.8
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: "1328362"
          filename: ${{ github.workspace }}\publish-wj\${{ steps.build.outputs.version }}.zip
          version: ${{ steps.build.outputs.version }}
          display_name: ${{ steps.build.outputs.version }}.zip
          description: "Release files, ignore this unless you're sure you need it"
          category: optional

      # --- Publish & announce ---

      - name: Publish GitHub release
        shell: pwsh
        run: |
          gh release edit "${{ steps.build.outputs.version }}" --draft=false
          Write-Host "Release ${{ steps.build.outputs.version }} is now live!"

      - name: Post to Discord
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
              Write-Host "DISCORD_RELEASE_WEBHOOK not set, skipping"
              exit 0
          }

          $version = "${{ steps.build.outputs.version }}"

          # Extract changelog section for this version
          $content = Get-Content CHANGELOG.md -Raw
          $releaseNotes = ""
          if ($content -match "(?ms)(#### Version - $([regex]::Escape($version)) - .+?)(?=\r?\n#### Version - |\z)") {
              $releaseNotes = $Matches[1].Trim()
          }

          $header = @"
          $version is released

          Please download via the launcher or via the link on the website: https://www.wabbajack.org/
          Or on the Nexus: https://www.nexusmods.com/site/mods/403
          "@
          $header = ($header -split "`n" | ForEach-Object { $_.Trim() }) -join "`n"

          function Send-DiscordMessage {
              param([string]$Content)
              $payload = @{ content = $Content; flags = 4 } | ConvertTo-Json -Depth 5 -Compress
              Invoke-RestMethod -Uri $env:DISCORD_RELEASE_WEBHOOK -Method POST `
                  -ContentType "application/json" -Body $payload | Out-Null
          }

          $fullMessage = "$header`n`n$releaseNotes"
          if ($fullMessage.Length -le 2000) {
              Send-DiscordMessage -Content $fullMessage
          } else {
              Write-Host "Message exceeds 2000 chars, splitting"
              Send-DiscordMessage -Content $header
              Send-DiscordMessage -Content $releaseNotes
          }
          Write-Host "Posted to Discord"

  linux-publish:
    needs: [linux, release]
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Fetch the Linux builds
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: linux-release

      - name: Read the version
        id: version
        run: |
          tarball=$(ls linux-release/*-linux-x64.tar.gz | grep -v '/Wabbajack-linux-x64.tar.gz$')
          echo "version=$(basename "$tarball" -linux-x64.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Attach the Linux builds to the release
        run: |
          gh release upload "${{ steps.version.outputs.version }}" linux-release/*.tar.gz \
            --repo "${{ github.repository }}"

      # Once their file entries exist on the Nexus page and their ids are set as the repository variables
      # NEXUS_LINUX_FILE_ID and NEXUS_LINUX_LAUNCHER_FILE_ID; skipped until then. Old launchers take the first
      # Nexus file whose name ends in .zip and parses as a version, so these names must keep their .tar.gz.

      - name: Upload Linux launcher to Nexus Mods
        if: ${{ vars.NEXUS_LINUX_LAUNCHER_FILE_ID != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.8
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ vars.NEXUS_LINUX_LAUNCHER_FILE_ID }}
          filename: linux-release/Wabbajack-linux-x64.tar.gz
          version: ${{ steps.version.outputs.version }}
          display_name: Wabbajack-linux-x64.tar.gz
          description: |
            Version - ${{ steps.version.outputs.version }} - Linux (beta): unpack and run Wabbajack/Wabbajack

            Changelog: https://github.com/wabbajack-tools/wabbajack/releases/tag/${{ steps.version.outputs.version }}
          category: main

      - name: Upload full Linux release to Nexus Mods
        if: ${{ vars.NEXUS_LINUX_FILE_ID != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.8
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ vars.NEXUS_LINUX_FILE_ID }}
          filename: linux-release/${{ steps.version.outputs.version }}-linux-x64.tar.gz
          version: ${{ steps.version.outputs.version }}
          display_name: ${{ steps.version.outputs.version }}-linux-x64.tar.gz
          description: "Linux (beta) release files, ignore this unless you're sure you need it"
          category: optional
